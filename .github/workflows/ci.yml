name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the one already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # nx-set-shas reads previous runs (base = last green commit on push to main)

env:
  # Yarn writes its cache inside the project (.yarn/cache) so it can be cached.
  YARN_ENABLE_GLOBAL_CACHE: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected diffs base..head: it needs the full history

      # `yarn check` (package.json) and this workflow must verify the same thing, so a green
      # `yarn check` can never hide a red CI and vice versa. They cannot share one command —
      # `yarn check` runs `run-many` (every project), CI runs `affected` (only the touched ones),
      # and that difference is deliberate. What must not drift is the list of Nx *targets* and the
      # two repo-wide Oxc steps: #40 already had to add `typecheck` to one side, this guard stops
      # the next such gap. Each list is read from the file that owns it, so the check never
      # becomes a third copy of the target list. Runs first: it is pure text and fails cheap.
      - name: check and CI verify the same targets
        run: |
          set -euo pipefail

          check_targets=$(sed -n 's/.*"check": ".*nx run-many -t \([a-z ]*[a-z]\).*/\1/p' package.json)
          ci_targets=$(sed -n 's/.*nx affected -t \([a-z ]*[a-z]\).*/\1/p' .github/workflows/ci.yml)

          # An empty capture means the command was renamed or reshaped, not that the lists agree:
          # without this, two empty strings compare equal and the gate passes having read nothing.
          fail=0
          [ -n "$check_targets" ] || { echo "::error::could not read the Nx targets from the 'check' script in package.json — it moved or changed shape, update this check"; fail=1; }
          [ -n "$ci_targets" ] || { echo "::error::could not read the Nx targets from 'nx affected' in ci.yml — it moved or changed shape, update this check"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

          # Compare as sets: target order carries no meaning, so sort before diffing.
          normalize() { echo "$1" | tr ' ' '\n' | sort | paste -sd' ' -; }
          check_norm=$(normalize "$check_targets")
          ci_norm=$(normalize "$ci_targets")
          if [ "$check_norm" != "$ci_norm" ]; then
            echo "::error::yarn check verifies [$check_norm] but CI verifies [$ci_norm] — the Nx target lists diverged, align both sides"
            exit 1
          fi

          # The two Oxc steps run repo-wide on both sides (spelled via aliases, so outside the set
          # comparison above); guard their presence so neither side can silently drop one. The CI
          # patterns are line-anchored to the real command lines, never this guard's own text.
          grep -qF 'oxlint --type-aware' package.json || { echo "::error::package.json no longer runs 'oxlint --type-aware'"; fail=1; }
          grep -qF 'oxfmt --check' package.json || { echo "::error::package.json no longer runs 'oxfmt --check'"; fail=1; }
          grep -qE '^[[:space:]]*yarn oxlint --type-aware[[:space:]]*$' .github/workflows/ci.yml || { echo "::error::ci.yml no longer runs 'yarn oxlint --type-aware'"; fail=1; }
          grep -qE '^[[:space:]]*yarn format:check[[:space:]]*$' .github/workflows/ci.yml || { echo "::error::ci.yml no longer runs 'yarn format:check'"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.1 # exact pin, aligned with Volta (CLAUDE.md)

      # Node 26 no longer ships Corepack: Yarn 4 is installed explicitly (CLAUDE.md).
      - name: Install Yarn 4
        run: |
          npm i -g @yarnpkg/cli-dist@4.18.0
          yarn --version

      - name: Cache Yarn & Nx
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .nx/cache
          key: ${{ runner.os }}-yarn-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-nx-

      - name: Install dependencies
        run: yarn install --immutable

      # Compute NX_BASE / NX_HEAD for `nx affected`:
      #   PR -> merge-base with main; push to main -> last green commit.
      - uses: nrwl/nx-set-shas@v5

      # oxlint and oxfmt cover the whole repo (fast, not bound to the Nx graph); nx affected
      # restricts lint (ESLint/boundaries), typecheck and test to the touched projects.
      # `--type-aware` runs the tsgolint engine (oxlint-tsgolint): it type-checks, so it costs
      # roughly +0.6 s on this repo — measured, and small enough to stay in this step rather
      # than earn a job of its own.
      - name: Checks
        run: |
          yarn oxlint --type-aware
          yarn format:check
          yarn nx affected -t lint typecheck test build

  # Dedicated job: infra/ has nothing to do with Nx, and its gates (terraform test) are
  # hermetic — mock_provider means no GCP credentials, no cost, safe to run on every PR.
  # Kept separate from `check` rather than folded in.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Terraform and tflint are pinned in three files that cannot read each other:
      # infra/.terraform-version (tfenv), infra/mise.toml (mise) and this workflow. The
      # duplication is accepted — mise no longer reads .terraform-version by default, and
      # tfenv reads nothing else — but silent drift is not: a local toolchain a version
      # behind CI produces a `plan` that differs from the one CI produced, which is the
      # whole point of pinning exactly. Every value below is read from the file that uses
      # it, so this check never becomes a fourth copy of its own.
      - name: toolchain pins agree (mise, .terraform-version, CI)
        run: |
          set -euo pipefail
          fail=0

          ci_terraform=$(sed -n 's/^ *terraform_version: *\([0-9][0-9.]*\).*/\1/p' .github/workflows/ci.yml)
          ci_tflint=$(sed -n 's/^ *tflint_version: *v\([0-9][0-9.]*\).*/\1/p' .github/workflows/ci.yml)
          tfenv_terraform=$(tr -d '[:space:]' < infra/.terraform-version)
          mise_terraform=$(sed -n 's/^terraform *= *"\([^"]*\)".*/\1/p' infra/mise.toml)
          mise_tflint=$(sed -n 's/^tflint *= *"\([^"]*\)".*/\1/p' infra/mise.toml)

          # An empty capture means a pin was renamed or reformatted, not that the pins
          # agree: without this, two empty strings would compare equal and the gate would
          # pass having checked nothing.
          for pin in ci_terraform ci_tflint tfenv_terraform mise_terraform mise_tflint; do
            if [ -z "${!pin}" ]; then
              echo "::error::${pin} could not be read — the pin moved or changed shape, update this check"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::${1} pins ${2}, but CI pins ${3} — update every copy together"
              fail=1
            fi
          }

          expect "infra/.terraform-version" "$tfenv_terraform" "$ci_terraform"
          expect "infra/mise.toml (terraform)" "$mise_terraform" "$ci_terraform"
          expect "infra/mise.toml (tflint)" "$mise_tflint" "$ci_tflint"

          exit $fail

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9 # exact pin, satisfies infra/*/versions.tf's required_version (>= 1.9)
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Install checkov
        run: pip install --quiet checkov==3.3.11

      - name: terraform fmt (whole tree)
        run: terraform fmt -check -recursive infra

      - name: terraform validate + tflint (every module and env)
        run: |
          set -euo pipefail
          for dir in infra/modules/*/ infra/envs/*/; do
            echo "::group::${dir}"
            (
              cd "$dir"
              terraform init -backend=false -input=false
              terraform validate
              tflint --config "${GITHUB_WORKSPACE}/infra/.tflint.hcl"
            )
            echo "::endgroup::"
          done

      # TDD is not optional for the IaC either (CLAUDE.md): a config nobody tests is a config
      # nothing is checking. `terraform test` exits 0 on a directory holding no test file at
      # all, so a green suite is not by itself evidence that anything was tested — this gate is
      # what makes a new, untested module or env fail instead of sailing through green.
      - name: terraform test coverage gate (every module and env has tests)
        run: |
          set -euo pipefail
          untested=()
          for dir in infra/modules/*/ infra/envs/*/; do
            # Count run blocks rather than files: an empty .tftest.hcl passes just as silently.
            run_blocks=$(cat "${dir}"tests/*.tftest.hcl 2>/dev/null | grep -c '^run "' || true)
            if [ "${run_blocks}" -eq 0 ]; then
              untested+=("${dir}")
            fi
          done
          if [ ${#untested[@]} -ne 0 ]; then
            for dir in "${untested[@]}"; do
              echo "::error::${dir} has no Terraform test — expected run blocks in ${dir}tests/*.tftest.hcl"
            done
            exit 1
          fi

      # Hermetic: mock_provider means every suite runs without GCP or Neon credentials and
      # without touching real infrastructure. envs/ is covered too, not just modules: the root
      # config is where the modules are wired together, and no module test can see that wiring.
      - name: terraform test (modules and envs)
        run: |
          set -euo pipefail
          for dir in infra/modules/*/ infra/envs/*/; do
            echo "::group::${dir}"
            (cd "$dir" && terraform test)
            echo "::endgroup::"
          done

      - name: checkov
        run: checkov -d infra --framework terraform --compact
