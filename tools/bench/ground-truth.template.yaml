# Vérité terrain du jeu de référence — MODÈLE À COMPLÉTER PAR UN HUMAIN.
#
# Copier ce fichier en `tools/bench/ground-truth.yaml`, puis, pour chaque photo, saisir la
# liste réelle des couples (auteur, titre) présents et lisibles sur l'étagère. Sans cette
# vérité vérifiée à l'œil, ni rappel, ni précision, ni hallucination ne sont mesurables, donc
# aucun fournisseur ne peut être départagé (#10, ADR 0005).
#
# Réserve de méthode (commentaire du 31/08 sur #10) : cette vérité DOIT être vérifiée par un
# humain. Un brouillon produit par un VLM pour départager deux VLM mesure leur accord, pas leur
# exactitude. La sortie brute d'un run (`tools/bench/output/<provider>.json`) fait gagner de la
# saisie — elle ne dispense pas de la vérification.
#
# Règles de saisie :
#   - un livre = un couple { author, title }, tel qu'il est lu sur la tranche (avant toute
#     réconciliation) ; ne pas confondre l'auteur/titre avec l'éditeur ou la collection ;
#   - une tranche illisible n'est pas saisie (elle deviendra un faux négatif, ce qui est voulu) ;
#   - une étagère sans aucun livre lisible : `books: []`.
#
# Le fichier réel `ground-truth.yaml` est commité (texte, aucune image), à côté de ce modèle.

