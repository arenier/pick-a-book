# The repository's toolchain, pinned in one place (ADR 0001, amended 2026-09-28): `mise install`
# at the root sets up everything `yarn check` and the infra checks need, and CI installs from
# this very file (jdx/mise-action). Exact pins only, never a range.
#
# Two copies remain by necessity, each watched by a CI guard: the Node pin of docker/*.Dockerfile
# (no mise inside a container), and nothing else. The Postgres client (psql, pg_dump) is left out
# on purpose: mise builds it from source — see tools/db-backup/README.md for how to get it.

[tools]
node = "26.5.1"
# Yarn 4, from the package CLAUDE.md, CI and the images all name: on npm, `yarn` is Yarn Classic.
"npm:@yarnpkg/cli-dist" = "4.18.0"
terraform = "1.15.9"
tflint = "0.64.0"
# Only versions with a published binary install: 3.3.11, the former pin, has a tag but no release
# asset. 3.3.20 finds exactly what 3.3.11 did on infra/.
checkov = "3.3.20"

[settings]
# Installs npm-backed tools with npm itself. On "auto", mise may pick another installer that
# leaves no node_modules/.bin behind — Yarn then installs but `yarn` is not on the PATH.
npm.package_manager = "npm"
