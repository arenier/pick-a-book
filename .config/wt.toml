# Configuration projet — worktrunk (https://worktrunk.dev)
# Réglages partagés avec l'équipe via le repo. Docs hooks : https://worktrunk.dev/hook/

# À la création d'un worktree : installer ses dépendances. Le linker `node-modules`
# (ADR 0001/0007, pas de PnP) implique un `node_modules` par worktree.
pre-start = "yarn install"

# Colonne URL de `wt list` : le front, sur le port dérivé du nom de branche (alias `web`).
# Grisée tant que le port n'écoute pas.
[list]
url = "http://localhost:{{ (branch ~ '-web') | hash_port }}"

# Alias partagés, lancés via `wt <nom>`. Ports dérivés du nom de branche pour faire
# tourner plusieurs worktrees en parallèle sans collision de ports.
#   wt api → API NestJS (lit PORT, cf. apps/api/src/config/environment.ts)
#   wt web → front Vite (lit WEB_PORT, cf. apps/web/vite.config.mts)
[aliases]
api = "PORT={{ branch | hash_port }} yarn nx serve api"
web = "WEB_PORT={{ (branch ~ '-web') | hash_port }} yarn nx serve web"
