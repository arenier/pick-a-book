# Local development. This file does not describe production: production is a container
# image on Cloud Run plus a bucket (ADR 0004).
#
# Persistence is Postgres (ADR 0006), so the stack runs one: production is Neon, and
# developing against the same engine is the whole point. Shelf photos are kept too, in a
# bucket (ADR 0004), so the stack runs an emulator of one — same reasoning as the database:
# develop against the API production speaks, not a mock of it.
#
# The Dockerfiles live in docker/ and take the repository root as their build context.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: '3000'
      # Local stand-in for the Neon endpoint; production reads this same variable from
      # Secret Manager.
      DATABASE_URL: postgresql://pick_a_book:pick_a_book@db:5432/pick_a_book
      # Bucket holding the shelf photos. The emulator below serves it; the name matches the
      # directory it is seeded with.
      BUCKET_NAME: pick-a-book-photos
      # Points the bucket client at the emulator. Absent in production, where the SDK talks
      # to the real GCS. NOT named STORAGE_EMULATOR_HOST: the SDK reads that one itself and
      # takes it as the whole base URL, dropping the /storage/v1 prefix the emulator serves.
      BUCKET_EMULATOR_HOST: http://bucket:4443
      # Owner segment of a stored photo's key. A fixed value, not an account: no
      # authentication exists yet (specs/001-photo-upload/research.md §10).
      OWNER_ID: ${OWNER_ID:-default}
      # Origin the API accepts browser calls from — the `web` service below.
      WEB_ORIGIN: http://localhost:4200
      # Defaults to the stub, so the stack comes up without any provider key. Export the
      # variables in your shell (or .env) to point it at a real VLM.
      SHELF_SCANNER_PROVIDER: ${SHELF_SCANNER_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      bucket:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '4200:4200'
    depends_on:
      - api

  # Stands in for Neon (ADR 0006). The major version is pinned here only: `infra/modules/neon`
  # creates the project without `pg_version` and takes Neon's default, so the two pins are
  # maintained by hand — same arrangement as the Node pins of docker/.
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: pick_a_book
      POSTGRES_PASSWORD: pick_a_book
      POSTGRES_DB: pick_a_book
    # Published on 5433, not 5432: `yarn api` runs on the host and needs to reach this
    # database, but the default port would collide with a Postgres already installed there.
    # Inside the compose network the API still talks to `db:5432` — only the host side moves,
    # so `.env.example` carries 5433 and has to move with it.
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pick_a_book -d pick_a_book']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Stands in for the GCS bucket (ADR 0004). The filesystem backend serves one bucket per
  # directory under its root, so the seeded `pick-a-book-photos/` directory *is* the bucket —
  # no creation step, and the stored objects are plain files you can look at.
  bucket:
    image: fsouza/fake-gcs-server:1.52.2
    command:
      [
        '-scheme',
        'http',
        '-host',
        '0.0.0.0',
        '-port',
        '4443',
        '-backend',
        'filesystem',
        '-filesystem-root',
        '/data',
        '-public-host',
        'bucket:4443',
      ]
    volumes:
      - ./docker/fake-gcs-data:/data
    # Published so `yarn api` on the host can reach it too, like the database above.
    ports:
      - '4443:4443'

volumes:
  db-data:
