# Local development. This file does not describe production: production is a container
# image on Cloud Run plus a bucket (ADR 0004).
#
# No database service, and that is not an oversight. Persistence is SQLite on the mounted
# bucket (ADR 0006): adding Postgres or MySQL here would mean developing against a database
# production does not have. The SQLite file lives in a volume; the bucket is stood in for by
# fake-gcs-server.
#
# The Dockerfiles live in docker/ and take the repository root as their build context.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: '3000'
      # The `api-data` volume stands in for the bucket mounted as a gcsfuse volume.
      DATABASE_PATH: /data/pick-a-book.sqlite
      STORAGE_BUCKET: pick-a-book-photos
      STORAGE_EMULATOR_HOST: http://storage:4443
      SHELF_SCANNER_API_KEY: ${SHELF_SCANNER_API_KEY:-}
    ports:
      - '3000:3000'
    volumes:
      - api-data:/data
    depends_on:
      storage:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '4200:4200'
    depends_on:
      - api

  # Plays the part of the bucket: shelf photos are objects, not rows.
  storage:
    image: fsouza/fake-gcs-server:1.52.2
    command: ['-scheme', 'http', '-port', '4443', '-public-host', 'storage:4443']
    ports:
      - '4443:4443'
    volumes:
      - storage-data:/storage

volumes:
  api-data:
  storage-data:
